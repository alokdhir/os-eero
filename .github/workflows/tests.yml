name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: unit tests
        working-directory: tests
        run: python -W error::ResourceWarning -m unittest test_client test_session test_history test_store test_poller test_query test_login test_units test_config
