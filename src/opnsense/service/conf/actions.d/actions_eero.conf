[start]
command:/usr/local/etc/rc.d/eero start
type:script
message:starting eero

[stop]
command:/usr/local/etc/rc.d/eero onestop
errors:no
type:script
message:stopping eero

[restart]
command:/usr/local/etc/rc.d/eero restart
type:script
message:restarting eero
description:Restart the eero status poller

[status]
command:/usr/local/etc/rc.d/eero status; exit 0
type:script_output
message:eero status

[query]
command:/usr/local/opnsense/scripts/eero/query.py
parameters:%s
type:script_output

[signin]
command:/usr/local/opnsense/scripts/eero/login.py signin
parameters:%s
type:script_output
message:eero sign-in: asking eero for a code

[verify]
command:/usr/local/opnsense/scripts/eero/login.py verify
parameters:%s
type:script_output
message:eero sign-in: checking the code

[signout]
command:/usr/local/opnsense/scripts/eero/login.py signout
type:script_output
message:eero sign-out
